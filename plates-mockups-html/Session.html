<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plates · Live session</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#fff}a:hover{color:#fff}
.rep{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:16px;background:#1C1C1F}
.rn{width:52px;font-size:13px;font-weight:600;color:#A1A1A6}
.rt{flex:1;font-size:20px;font-weight:800;letter-spacing:-0.01em}
.rm{font-size:12px;font-weight:600;color:#A1A1A6}
.pill{height:36px;padding:0 14px;border-radius:999px;border:0;background:#1C1C1F;color:#D1D1D6;font:600 13px Inter,sans-serif}
.key{height:56px;border-radius:16px;border:0;background:#1C1C1F;color:#fff;font:700 24px Inter,sans-serif;display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div style="width: 390px; height: 940px; box-sizing: border-box; padding: 56px 20px 32px; background: #0B0B0C; font-family: Inter, -apple-system, system-ui, sans-serif; color: #fff; display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; justify-content: space-between; align-items: center">
<a href="Main.dc.html" aria-label="Back to Today" style="width: 40px; height: 40px; border-radius: 999px; background: #1C1C1F; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" aria-hidden="true" style="stroke-width: 2.4px; stroke-linecap: round; stroke-linejoin: round"><path d="M15 5l-7 7 7 7"></path></svg></a>
<div style="font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums">18:42</div>
<button style="height: 40px; padding: 0 18px; border-radius: 999px; border: 0; background: #1C1C1F; color: #fff; font: 700 14px Inter, sans-serif">Finish</button>
</div>

<div>
<div style="font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Speed + Lower</div>
<div style="font-size: 13px; font-weight: 600; color: #A1A1A6; margin-top: 4px">Block 1 of 3 · Sprint</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 10px">
<div style="height: 5px; border-radius: 999px; background: #2A2A2E"><div style="width: 55%; height: 5px; border-radius: 999px; background: {{accent}}"></div></div>
<div style="height: 5px; border-radius: 999px; background: #2A2A2E"></div>
<div style="height: 5px; border-radius: 999px; background: #2A2A2E"></div>
</div>
</div>

<div style="background: #151517; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px">
<div>
<div style="font-size: 18px; font-weight: 800">30 m fly @ 95%</div>
<div style="font-size: 13px; font-weight: 500; color: #A1A1A6; margin-top: 3px">Target 3.05 s · PR 2.90 s (FAT)</div>
</div>
<span style="padding: 6px 11px; border-radius: 999px; background: #2A2A2E; font-size: 12px; font-weight: 700; color: #D1D1D6; font-variant-numeric: tabular-nums">Rest 0:48</span>
</div>
<div class="rep"><span class="rn">Rep 1</span><span class="rt">3.08 s</span><span class="rm">Hand · +0.8</span></div>
<div class="rep"><span class="rn">Rep 2</span><span class="rt">3.03 s</span><span style="padding: 3px 8px; border-radius: 999px; background: {{accent}}; color: #111; font-size: 11px; font-weight: 800">On target</span></div>
<div class="rep" style="box-shadow: inset 0 0 0 2px {{accent}}; background: #1F1A17"><span class="rn" style="color: #fff">Rep 3</span><span class="rt" style="font-size: 30px">3.0<span style="color: #5A5A60">_</span></span><span class="rm">s</span></div>
<div class="rep" style="opacity: .45"><span class="rn">Rep 4</span><span class="rt" style="color: #8E8E93">—</span></div>
</div>

<div style="display: flex; gap: 8px; flex-wrap: wrap">
<button class="pill" style="background: #fff; color: #111">Hand</button>
<button class="pill">FAT</button>
<button class="pill">Laser</button>
<button class="pill" style="margin-left: auto">Wind +1.2</button>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button class="key">1</button><button class="key">2</button><button class="key">3</button>
<button class="key">4</button><button class="key">5</button><button class="key">6</button>
<button class="key">7</button><button class="key">8</button><button class="key">9</button>
<button class="key">.</button><button class="key">0</button>
<button class="key" aria-label="Delete"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" aria-hidden="true" style="stroke-width: 2px; stroke-linecap: round; stroke-linejoin: round"><path d="M9 5h11v14H9l-6-7zM12 9l5 6M17 9l-5 6"></path></svg></button>
</div>

<button style="height: 56px; border-radius: 18px; border: 0; background: {{accent}}; color: #111; font: 800 17px Inter, sans-serif">Save rep · start rest</button>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF6B1A","options":["#FF6B1A","#F97316","#FF8A3D","#E8590C"]},"$preview":{"width":390,"height":940}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#FF6B1A' };
}
}
</script>
</body>
</html>
