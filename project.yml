name: Plates
options:
  bundleIdPrefix: com.maxpjeff
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.31.0
targets:
  Plates:
    type: application
    platform: iOS
    sources:
      - path: Plates
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxpjeff.plates
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Plates/Info.plist
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: Supabase
        product: Supabase
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
